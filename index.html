<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MOSIP Contributors (POC)</title>
  <style>
    body { font-family: sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
    th, td { text-align: left; padding: 0.6rem 0.75rem; border-bottom: 1px solid #ddd; }
    th { cursor: pointer; user-select: none; }
    th.sorted-desc::after { content: " \25BC"; }
    th.sorted-asc::after { content: " \25B2"; }
    td.name-cell { display: flex; align-items: center; gap: 0.6rem; }
    td.name-cell img { border-radius: 50%; width: 32px; height: 32px; }
    td.name-cell a { color: inherit; text-decoration: none; }
    td.name-cell a:hover { text-decoration: underline; }
    td.commits, td.repo-count { text-align: right; font-variant-numeric: tabular-nums; }
    td.repos-cell { max-width: 260px; font-size: 0.8rem; color: #555; }
  </style>
</head>
<body>
  <h1>MOSIP Contributors — Org-Wide POC</h1>
  <p id="status">Loading…</p>
  <table>
    <thead>
      <tr>
        <th data-key="login">Name</th>
        <th data-key="id">ID</th>
        <th data-key="contributions">Commits</th>
        <th data-key="repoCount">Repos</th>
        <th data-key="lastActive">Last Active</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    // Generated by contributor-aggregator (npm run aggregate) across the
    // repos listed in contributor-aggregator/repos.json, then copied here.
    // Regenerate + re-copy to refresh this table.
    const DATA_FILE = "contributors.json";

    let contributors = [];
    let sortKey = "contributions";
    let sortDir = "desc";

    function render() {
      const rows = document.getElementById("rows");
      rows.innerHTML = "";
      const sorted = [...contributors].sort((a, b) => {
        const diff = a[sortKey] > b[sortKey] ? 1 : a[sortKey] < b[sortKey] ? -1 : 0;
        return sortDir === "asc" ? diff : -diff;
      });
      sorted.forEach((c) => {
        const tr = document.createElement("tr");
        const lastActiveLabel = c.lastActive
          ? new Date(c.lastActive).toLocaleDateString()
          : "—";
        tr.innerHTML = `
          <td class="name-cell">
            <img src="${c.avatarUrl}" alt="${c.login}">
            <a href="${c.htmlUrl}" target="_blank">${c.login}</a>
          </td>
          <td>${c.id}</td>
          <td class="commits">${c.contributions}</td>
          <td class="repo-count">${c.repoCount}</td>
          <td>${lastActiveLabel}</td>
        `;
        tr.title = c.repos.join(", ");
        rows.appendChild(tr);
      });
      document.querySelectorAll("th").forEach((th) => {
        th.classList.toggle("sorted-asc", th.dataset.key === sortKey && sortDir === "asc");
        th.classList.toggle("sorted-desc", th.dataset.key === sortKey && sortDir === "desc");
      });
    }

    document.querySelectorAll("th[data-key]").forEach((th) => {
      th.addEventListener("click", () => {
        const key = th.dataset.key;
        if (sortKey === key) {
          sortDir = sortDir === "asc" ? "desc" : "asc";
        } else {
          sortKey = key;
          sortDir = "desc";
        }
        render();
      });
    });

    fetch(DATA_FILE)
      .then((res) => {
        if (!res.ok) throw new Error(`Could not load ${DATA_FILE} (${res.status})`);
        return res.json();
      })
      .then((data) => {
        contributors = data.map((c) => ({ ...c, repoCount: c.repos.length }));
        const repoSet = new Set(contributors.flatMap((c) => c.repos));
        document.getElementById("status").textContent =
          `${contributors.length} deduped contributors across ${repoSet.size} repos`;
        render();
      })
      .catch((err) => {
        document.getElementById("status").textContent = `Failed to load: ${err.message}`;
      });
  </script>
</body>
</html>
