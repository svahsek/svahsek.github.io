<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MOSIP Contributors (POC)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f4f8;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #1c1f27;
      --muted: #6b7280;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --row-alt: #fafafa;
      --row-hover: #f5f3ff;
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 1080px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    header {
      margin-bottom: 1.75rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 0.35rem;
      letter-spacing: -0.02em;
    }

    #status {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0;
    }

    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 24px rgba(16, 24, 40, 0.06);
      margin-top: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: var(--accent-soft);
      color: var(--accent);
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-align: left;
      padding: 0.9rem 1.1rem;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    thead th:hover {
      color: #3730a3;
    }

    th.sorted-desc::after { content: " \25BC"; font-size: 0.6rem; }
    th.sorted-asc::after { content: " \25B2"; font-size: 0.6rem; }

    tbody td {
      padding: 0.85rem 1.1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
      vertical-align: middle;
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody tr:hover { background: var(--row-hover); }

    td.name-cell {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    td.name-cell img {
      border-radius: 50%;
      width: 52px;
      height: 52px;
      object-fit: cover;
      border: 2px solid var(--card);
      box-shadow: 0 0 0 1px var(--border);
      flex-shrink: 0;
    }

    td.name-cell a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.98rem;
    }

    td.name-cell a:hover { color: var(--accent); }

    td.id-cell { color: var(--muted); font-variant-numeric: tabular-nums; }

    td.commits {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .commit-badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
      min-width: 2.5rem;
      text-align: center;
    }

    td.repo-count { text-align: center; color: var(--muted); font-weight: 600; }
    td.last-active { color: var(--muted); white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <h1>MOSIP Contributors — Org-Wide POC</h1>
    <p id="status">Loading…</p>
  </header>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th data-key="login">Name</th>
          <th data-key="id">ID</th>
          <th data-key="contributions">Commits</th>
          <th data-key="repoCount">Repos</th>
          <th data-key="lastActive">Last Active</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    // Generated by contributor-aggregator (npm run aggregate) across the
    // repos listed in contributor-aggregator/repos.json, then copied here.
    // Regenerate + re-copy to refresh this table.
    const DATA_FILE = "contributors.json";

    let contributors = [];
    let sortKey = "contributions";
    let sortDir = "desc";

    function render() {
      const rows = document.getElementById("rows");
      rows.innerHTML = "";
      const sorted = [...contributors].sort((a, b) => {
        const diff = a[sortKey] > b[sortKey] ? 1 : a[sortKey] < b[sortKey] ? -1 : 0;
        return sortDir === "asc" ? diff : -diff;
      });
      sorted.forEach((c) => {
        const tr = document.createElement("tr");
        const lastActiveLabel = c.lastActive
          ? new Date(c.lastActive).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" })
          : "—";
        tr.innerHTML = `
          <td class="name-cell">
            <img src="${c.avatarUrl}" alt="${c.login}">
            <a href="${c.htmlUrl}" target="_blank">${c.login}</a>
          </td>
          <td class="id-cell">${c.id}</td>
          <td class="commits"><span class="commit-badge">${c.contributions}</span></td>
          <td class="repo-count">${c.repoCount}</td>
          <td class="last-active">${lastActiveLabel}</td>
        `;
        tr.title = c.repos.join(", ");
        rows.appendChild(tr);
      });
      document.querySelectorAll("th").forEach((th) => {
        th.classList.toggle("sorted-asc", th.dataset.key === sortKey && sortDir === "asc");
        th.classList.toggle("sorted-desc", th.dataset.key === sortKey && sortDir === "desc");
      });
    }

    document.querySelectorAll("th[data-key]").forEach((th) => {
      th.addEventListener("click", () => {
        const key = th.dataset.key;
        if (sortKey === key) {
          sortDir = sortDir === "asc" ? "desc" : "asc";
        } else {
          sortKey = key;
          sortDir = "desc";
        }
        render();
      });
    });

    fetch(DATA_FILE)
      .then((res) => {
        if (!res.ok) throw new Error(`Could not load ${DATA_FILE} (${res.status})`);
        return res.json();
      })
      .then((data) => {
        contributors = data.map((c) => ({ ...c, repoCount: c.repos.length }));
        const repoSet = new Set(contributors.flatMap((c) => c.repos));
        document.getElementById("status").textContent =
          `${contributors.length} deduped contributors across ${repoSet.size} repos`;
        render();
      })
      .catch((err) => {
        document.getElementById("status").textContent = `Failed to load: ${err.message}`;
      });
  </script>
</body>
</html>
